name: fm2024-mongoose-03-10-2024
services:
  back:
    build: 
      context: ./
    ports:
      - "8080:3000"
    environment:
      - PORT=3000
    depends_on:
      - db_mongo
    restart: on-failure      
    networks:
      - mongo-bridge-prodaction

  db_mongo:
    image: mongo:latest
    volumes:
      - ~/backup:/data/db
    restart: always  
    networks:
      - mongo-bridge-prodaction

networks:
  mongo-bridge-prodaction: {}
